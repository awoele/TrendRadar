<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TrendRadar 热点内容看板</title>
    <meta name="description" content="聚合小红书与抖音热点，快速筛选值得复刻的内容方向。">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./styles.css?v=dashboard-refresh-2">
  </head>
  <body>
    <main class="shell">
      <header class="page-header">
        <div class="brand-lockup">
          <div class="page-heading">
            <p class="eyebrow">TREND INTELLIGENCE</p>
            <h1>TrendRadar 热点内容看板</h1>
            <p class="page-subtitle">聚合小红书与抖音热点，快速筛出值得复刻的内容方向</p>
          </div>
        </div>
        <div class="header-actions">
          <nav class="page-tabs" aria-label="页面切换">
            <a href="./" aria-current="page">内容</a>
            <a href="../stats/">统计</a>
            <a href="../config/">配置</a>
          </nav>
          <div class="snapshot-pill" id="snapshotPill" aria-label="数据快照状态">
            <span class="status-dot" aria-hidden="true"></span>
            <span>最新快照</span>
            <strong id="snapshotTitle">读取中</strong>
          </div>
        </div>
      </header>

      <section class="toolbar content-controls" aria-label="内容筛选">
        <div class="control-group platform-control">
          <span class="control-label">平台</span>
          <section class="platform-strip compact" id="platformStrip" aria-label="平台数量"></section>
        </div>
        <label class="field platform-select-field">
          <span>平台</span>
          <select id="platformSelect">
            <option value="">全部平台</option>
          </select>
        </label>
        <section class="metric-grid metric-strip" aria-label="内容概览">
          <article class="metric-card">
            <span>收录热点</span>
            <strong id="totalCount">-</strong>
            <small>跨平台内容池</small>
          </article>
          <article class="metric-card accent">
            <span>当前结果</span>
            <strong id="visibleCount">-</strong>
            <small id="resultContext">载入筛选条件</small>
          </article>
          <article class="metric-card">
            <span>活跃平台</span>
            <strong id="platformCountMetric">-</strong>
            <small>已接入内容来源</small>
          </article>
          <article class="metric-card">
            <span>热度峰值</span>
            <strong id="topHeatMetric">-</strong>
            <small id="topHeatMetricLabel">按当前内容口径</small>
          </article>
        </section>
        <label class="field sort-field">
          <span>排序</span>
          <select id="sortSelect">
            <option value="published_at">最新发布</option>
            <option value="hot_score">热度最高</option>
            <option value="recent_hot_score">近期热度</option>
            <option value="likes">点赞最多</option>
          </select>
        </label>
        <button id="clearButton" type="button">重置</button>
      </section>

      <section class="search-filter-row" aria-label="搜索与更多筛选">
        <label class="field search-field search-panel">
          <span>搜索标题</span>
          <input id="searchInput" type="search" placeholder="例如 Codex、vibe coding、小游戏">
        </label>
        <details class="advanced-filters">
          <summary>
            <span class="filter-heading">
              <strong>更多筛选</strong>
              <small>按案例类型、方向、工具、爆点、价值和风险缩小范围</small>
            </span>
            <span class="filter-summary" id="activeFilterCount">未启用</span>
          </summary>
          <section class="toolbar topic-filters" aria-label="选题筛选">
            <label class="field">
              <span>类型</span>
              <select id="caseTypeSelect">
                <option value="">全部类型</option>
              </select>
            </label>
            <label class="field">
              <span>做了什么</span>
              <select id="builtThingSelect">
                <option value="">全部方向</option>
              </select>
            </label>
            <label class="field">
              <span>工具</span>
              <select id="toolStackSelect">
                <option value="">全部工具</option>
              </select>
            </label>
            <label class="field">
              <span>爆点</span>
              <select id="hookSelect">
                <option value="">全部爆点</option>
              </select>
            </label>
            <label class="field">
              <span>内容价值</span>
              <select id="contentValueSelect">
                <option value="">全部价值</option>
              </select>
            </label>
            <label class="field">
              <span>风险</span>
              <select id="riskFlagSelect">
                <option value="">全部风险</option>
              </select>
            </label>
          </section>
        </details>
      </section>

      <section class="content-section" aria-labelledby="contentHeading">
        <header class="section-heading">
          <div>
            <p class="section-kicker">CONTENT STREAM</p>
            <h2 id="contentHeading">热点内容</h2>
            <p>封面用于快速识别，卡片顶部细线表示当前结果中的相对热度</p>
          </div>
          <span class="result-pill" id="resultStatus">正在载入</span>
        </header>
        <section class="content-list" id="contentList" aria-live="polite"></section>
        <p class="empty" id="emptyState" hidden>没有匹配的内容，请减少筛选条件后重试</p>
        <div class="load-more-wrap" id="loadMoreWrap" hidden>
          <button class="load-more" id="loadMoreButton" type="button">查看更多</button>
        </div>
      </section>

      <details class="collection-runs" aria-label="抓取记录">
        <summary class="collection-summary">
          <span class="collection-heading">
            <strong>采集记录</strong>
            <small>查看最近的内容更新批次与来源</small>
          </span>
          <span class="collection-action">展开</span>
        </summary>
        <div class="run-list" id="collectionRunList"></div>
      </details>
    </main>

    <script src="./app.js?v=dashboard-refresh-1"></script>
  </body>
</html>
